name: Label by title prefix

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prefixToLabel = {
              feat: "enhancement",
              fix: "bug",
              docs: "documentation",
              chore: "chore",
              refactor: "refactor",
              test: "test",
            };

            const item = context.payload.issue ?? context.payload.pull_request;
            const match = item.title.match(/^(\w+):/);
            if (!match) return;

            const label = prefixToLabel[match[1]];
            if (!label) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              labels: [label],
            });
